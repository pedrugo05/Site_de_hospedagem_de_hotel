<!DOCTYPE HTML>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" href="estadia.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

</head>
<body>

    <div class="logotc">
        <span>TOURIST CAMP</span>
    </div>
    <!-- Conteúdo da Página -->
    <div id="content">
        <h2>Reserva do Hotel Cápsula</h2>

        <!-- Formulário de Reserva -->
        <form id="reservation-form">
            <div class="form-group">
                <label for="payment-method">Método de Pagamento:</label>
                <select id="payment-method" name="payment-method" required>
                    <option value="option">Escolha uma opção</option>
                    <option value="credit-card">Cartão de Crédito</option>
                    <option value="debit-card">Cartão de Débito</option>
                    <option value="pix">PIX</option>
                </select>
            </div>

           <!-- Área para cartão de crédito -->
          <div class="form-group" id="credit-card-details">
             <label for="credit-card-number">Número do Cartão:</label>
             <input type="text" id="credit-card-number" name="credit-card-number" placeholder="Insira o número do cartão" required>
    
             <label for="credit-card-cvv">CVV:</label>
             <input type="text" id="credit-card-cvv" name="credit-card-cvv" placeholder="Insira o CVV" required>

             <label for="credit-card-name">Nome do Usuário do Cartão:</label>
             <input type="text" id="credit-card-name" name="credit-card-name" placeholder="Insira o nome do usuário do cartão" required>
          </div>

          <!-- Área para cartão de débito -->
          <div class="form-group" id="debit-card-details">
             <label for="debit-card-number">Número do Cartão:</label>
             <input type="text" id="debit-card-number" name="debit-card-number" placeholder="Insira o número do cartão" required>

             <label for="debit-card-cvv">CVV:</label>
             <input type="text" id="debit-card-cvv" name="debit-card-cvv" placeholder="Insira o CVV" required>

             <label for="debit-card-name">Nome do Usuário do Cartão:</label>
             <input type="text" id="debit-card-name" name="debit-card-name" placeholder="Insira o nome do usuário do cartão" required>
           </div>


            <!--opção reserva pix-->
            <div class="form-group" id="pix-qr-code">
                <label for="pix-code">Código PIX:</label>
                <input type="text" id="pix-code" name="pix-code" placeholder="Insira o código PIX" required>
                <img src="images/pix.png" alt="QR Code PIX">
            </div>

            <div class="form-group">
                <label for="reservation-hours">Horas de Reserva:</label>
                <select id="reservation-hours" name="reservation-hours" required>
                    <option value="1">Escolha uma opção</option>
                    <option value="1">1 Hora</option>
                    <option value="2">2 Horas</option>
                    <option value="3">3 Horas</option>
                    <option value="4">4 Horas</option>
                    <option value="5">5 Horas</option>
                    <option value="6">6 Horas</option>
                    <option value="7">7 Horas</option>
                    <option value="8">8 Horas</option>
                    <option value="9">9 Horas</option>
                    <!-- Adicione mais opções conforme necessário -->
                </select>
            </div>

            <div class="form-group">
                <button type="submit">Reservar Agora</button>
            </div>
            <div class="form-group">
                <Button><a href="index.html" class="button">Voltar para o início</a></Button>
            </div>
            
        </form>
    </div>

    <!-- Rodapé -->
    <div id="footer-wrapper">
        <footer id="footer" class="container">
            <div class="row">
                <div class="col-12">
                    <!-- Contato -->
                    <div class="col-12">
                        <!-- Contato -->
                     <section class="widget contact last">
                         <h3>Contato</h3>
                         <a href="https://www.instagram.com/seu-usuario/" class="social-icon">
                            <i class="fab fa-instagram-square fa-3x" style="color: rgba(0, 0, 0, 0.5);"></i>
                        </a>
                        
                        <a href="https://api.whatsapp.com/send?phone=seu-numero" class="social-icon">
                            <i class="fab fa-whatsapp-square fa-3x" style="color: rgba(0, 0, 0, 0.5);"></i>
                        </a>
                        
                        <a href="mailto:seu-email@gmail.com" class="social-icon">
                            <i class="fa-solid fa-envelope fa-3x" style="color: rgba(0, 0, 0, 0.5);"></i>
                        </a>
                         
                         
                         
                     </section>
                 </div>
            </div>
            <div class="row">
                <div class="col-12">
                    <div id="copyright">
                        <ul class="menu">
                            <li>&copy; Criado pela Tourist Camp</li>
                        </ul>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <script>
        document.getElementById("payment-method").addEventListener("change", function() {
            var pixQrCode = document.getElementById("pix-qr-code");
            var creditCardDetails = document.getElementById("credit-card-details");
            var debitCardDetails = document.getElementById("debit-card-details");
    
            pixQrCode.style.display = "none";
            creditCardDetails.style.display = "none";
            debitCardDetails.style.display = "none";
    
            if (this.value === "pix") {
                pixQrCode.style.display = "block";
            } else if (this.value === "credit-card") {
                creditCardDetails.style.display = "block";
            } else if (this.value === "debit-card") {
                debitCardDetails.style.display = "block";
            }
        });
    
        // Adicione este bloco para ocultar todos os detalhes do cartão por padrão
        window.addEventListener("DOMContentLoaded", function() {
            var creditCardDetails = document.getElementById("credit-card-details");
            var debitCardDetails = document.getElementById("debit-card-details");
    
            creditCardDetails.style.display = "none";
            debitCardDetails.style.display = "none";
        });
    </script>

</body>
</html>
